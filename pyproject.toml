[project]
name = "mem0-mcp"
version = "0.1.0"
description = "MCP server for self-hosted mem0 REST API (add/search/list/delete memories)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2", "httpx"]

[project.scripts]
mem0-mcp = "mem0_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
